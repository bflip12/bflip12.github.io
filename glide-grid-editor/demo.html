<style>
  /* Shared design tokens for every portfolio page.
     Injected by shared/build.py wherever a page source contains the TOKENS placeholder.
     Change a value here, then rebuild every piece (see docs/pieces.md). */

  :root {
    /* grounds */
    --paper: #FCFBF9;        /* page background */
    --surface: #FFFFFF;      /* panels, cards, figures */
    --sunk: #F4F2EF;         /* recessed: chips, toggle tracks */
    --code-bg: #F4F2EF;      /* code blocks and inline code */
    --hover: #F3F0EC;

    /* ink */
    --ink: #171514;
    --ink-soft: #423D39;
    --ink-muted: #6E6862;
    --btn-ink: #FCFBF9;      /* text on --ink buttons */

    /* rules */
    --rule: #DFDAD3;
    --rule-soft: #ECE8E2;
    --rule-strong: #CFC9C1;

    /* meaning */
    --accent: #9E2A2B;       /* brand accent, also "wrong" / half-checked */
    --accent-wash: #F7E9E7;
    --on: #2F6B4F;           /* "correct" / checked */
    --on-wash: #E4EFE8;

    /* library look-alikes */
    --antd-blue: #1890FF;
    --cb-border: #BDB6AE;
    --hit: #FCE7A6;          /* search match highlight */

    /* code highlighting */
    --hl-key: #8A2C6B;
    --hl-str: #2F6B4F;
    --hl-num: #9C5410;
    --hl-com: #8A837B;
    --hl-fn: #2B5490;
    --hl-type: #9E2A2B;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #131211;
      --surface: #1B1917;
      --sunk: #1E1C1A;
      --code-bg: #1E1C1A;
      --hover: #25221F;
      --ink: #EDE9E4;
      --ink-soft: #C6BFB7;
      --ink-muted: #948C83;
      --btn-ink: #131211;
      --rule: #302C29;
      --rule-soft: #24211E;
      --rule-strong: #45403B;
      --accent: #E4837F;
      --accent-wash: #3A1E1D;
      --on: #7FC29B;
      --on-wash: #1B2E24;
      --antd-blue: #3C9AE8;
      --cb-border: #5E5852;
      --hit: #5A4715;
      --hl-key: #DD9BC8;
      --hl-str: #90CDA9;
      --hl-num: #E5A76C;
      --hl-com: #7E766E;
      --hl-fn: #93B4E8;
      --hl-type: #E4837F;
    }
  }

  :root[data-theme="dark"] {
    color-scheme: dark;
    --paper: #131211;
    --surface: #1B1917;
    --sunk: #1E1C1A;
    --code-bg: #1E1C1A;
    --hover: #25221F;
    --ink: #EDE9E4;
    --ink-soft: #C6BFB7;
    --ink-muted: #948C83;
    --btn-ink: #131211;
    --rule: #302C29;
    --rule-soft: #24211E;
    --rule-strong: #45403B;
    --accent: #E4837F;
    --accent-wash: #3A1E1D;
    --on: #7FC29B;
    --on-wash: #1B2E24;
    --antd-blue: #3C9AE8;
    --cb-border: #5E5852;
    --hit: #5A4715;
    --hl-key: #DD9BC8;
    --hl-str: #90CDA9;
    --hl-num: #E5A76C;
    --hl-com: #7E766E;
    --hl-fn: #93B4E8;
    --hl-type: #E4837F;
  }


  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "Source Sans 3", -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    max-width: 1140px;
    margin: 0 auto;
    padding-inline: 20px;
    padding-block: 40px 64px;
  }

  a { color: var(--accent); text-underline-offset: 2px; }

  header.top { margin-bottom: 24px; }

  header.top h1 {
    font-family: "Fraunces", Georgia, serif;
    font-size: clamp(1.75rem, 4.4vw, 2.35rem);
    font-weight: 700;
    letter-spacing: -0.02em;
    line-height: 1.08;
    margin: 0 0 8px;
    color: var(--ink);
  }

  header.top .sub { color: var(--ink-muted); font-size: 0.9375rem; margin: 0 0 14px; }

  header.top .intro {
    color: var(--ink);
    font-size: 1.0625rem;
    line-height: 1.55;
    max-width: 72ch;
    margin: 0;
  }

  /* ---------- controls ---------- */

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    gap: 14px 22px;
    margin-bottom: 20px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--rule);
  }
  .control { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .control.grow { flex: 1 1 220px; }
  .control-label {
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.11em;
    text-transform: uppercase;
    color: var(--ink-muted);
  }
  .caption {
    font-size: 0.8125rem;
    line-height: 1.4;
    color: var(--ink-soft);
    max-width: 38ch;
  }
  .caption code {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    background: var(--sunk);
    padding: 0 4px;
    border-radius: 2px;
  }

  /* ---------- layout ---------- */

  .main {
    display: grid;
    grid-template-columns: minmax(0, 330px) minmax(0, 1fr);
    gap: 20px;
    align-items: start;
  }

  .right { display: flex; flex-direction: column; gap: 14px; min-width: 0; }

  .pair {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    align-items: start;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--rule);
    border-radius: 4px;
    min-width: 0;
  }

  .panel-head {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 4px 12px;
    padding: 11px 16px 9px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .panel-title { font-size: 0.8125rem; font-weight: 700; color: var(--ink); }
  .panel-meta, .count {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.6875rem;
    color: var(--ink-muted);
    font-variant-numeric: tabular-nums;
  }
  .panel-body { padding: 10px 12px 12px; }

  /* ---------- walkthrough ---------- */

  .walk { padding: 16px 16px 18px; }
  .walk-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 12px;
  }
  .walk-title {
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
  }
  .walk-run {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.6875rem;
    color: var(--ink-muted);
  }

  ol.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
  ol.steps li {
    display: grid;
    grid-template-columns: 24px 1fr;
    gap: 0 10px;
    padding-bottom: 14px;
    position: relative;
  }
  ol.steps li:not(:last-child)::before {
    content: "";
    position: absolute;
    left: 11px;
    top: 24px;
    bottom: 2px;
    width: 1px;
    background: var(--rule);
  }
  .num {
    width: 24px; height: 24px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    font-weight: 500;
    border: 1.5px solid var(--rule-strong);
    color: var(--ink-muted);
    background: var(--surface);
    position: relative;
  }
  li.done .num { background: var(--ink); border-color: var(--ink); color: var(--btn-ink); }
  li.current .num { border-color: var(--accent); color: var(--accent); }
  .step-title { font-weight: 700; font-size: 0.9375rem; line-height: 24px; color: var(--ink); }
  li.upcoming .step-title { color: var(--ink-muted); font-weight: 600; }
  .step-body { grid-column: 2; font-size: 0.875rem; line-height: 1.5; color: var(--ink-soft); }
  .step-body p { margin: 3px 0 0; }
  .step-body b { color: var(--ink); }
  .step-body code {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.78rem;
    background: var(--sunk);
    padding: 0 4px;
    border-radius: 2px;
  }

  .btn {
    font: inherit;
    font-size: 0.875rem;
    font-weight: 700;
    color: var(--btn-ink);
    background: var(--ink);
    border: 0;
    border-radius: 3px;
    padding: 7px 14px;
    margin-top: 9px;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent); }
  .btn:focus-visible, .link-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .link-btn {
    font: inherit;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--accent);
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .walk-off { font-size: 0.875rem; color: var(--ink-soft); line-height: 1.5; }
  .walk-off p { margin: 0 0 4px; }

  /* ---------- status ---------- */

  .status {
    border-radius: 4px;
    padding: 13px 16px 14px;
    border: 1px solid var(--rule);
    background: var(--surface);
  }
  .status.bad { background: var(--accent-wash); border-color: var(--accent); }
  .status.ok { background: var(--on-wash); border-color: var(--on); }
  .s-label {
    font-size: 0.6875rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 4px;
    color: var(--ink-muted);
  }
  .status.bad .s-label { color: var(--accent); }
  .status.ok .s-label { color: var(--on); }
  .s-text { color: var(--ink); font-size: 0.9375rem; line-height: 1.45; }
  .s-note { margin-top: 6px; font-size: 0.8125rem; color: var(--ink-soft); font-style: italic; }
  .s-click {
    margin-top: 10px;
    padding-top: 9px;
    border-top: 1px solid var(--rule-strong);
    font-size: 0.875rem;
    color: var(--ink-soft);
  }
  .s-click b { color: var(--ink); }

  /* ---------- chips ---------- */

  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    line-height: 1.3;
    padding: 3px 7px;
    border-radius: 3px;
    background: var(--sunk);
    color: var(--ink);
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .chip.folder { background: transparent; border-color: var(--antd-blue); color: var(--antd-blue); }
  .chip.more { background: transparent; color: var(--ink-muted); }

  .empty { color: var(--ink-muted); font-size: 0.875rem; font-style: italic; }
  .hint { font-size: 0.8125rem; color: var(--ink-muted); margin: 9px 0 0; line-height: 1.45; }

  .legend { display: flex; gap: 14px; margin-top: 10px; font-size: 0.75rem; color: var(--ink-muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; }
  .legend i.l { background: var(--sunk); border: 1px solid var(--rule-strong); }
  .legend i.f { border: 1.5px solid var(--antd-blue); }

  .seg {
    display: inline-flex;
    align-self: flex-start;
    gap: 2px;
    padding: 2px;
    background: var(--sunk);
    border-radius: 3px;
  }
  .seg button {
    font: inherit;
    font-size: 0.875rem;
    line-height: 1.2;
    color: var(--ink-soft);
    background: transparent;
    border: 0;
    border-radius: 2px;
    padding: 6px 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  .seg button:hover { color: var(--ink); }
  .seg button[aria-checked="true"] {
    background: var(--surface);
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
  }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }


  /* ---------- grid panel ---------- */

  .toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px 16px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--rule-soft);
  }
  .add-col { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
  .add-col label { font-size: 0.8125rem; font-weight: 700; color: var(--ink); }
  .field {
    font: inherit;
    font-size: 0.875rem;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    padding: 5px 8px;
    width: 150px;
  }
  .field:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .field[aria-invalid="true"] { border-color: var(--accent); }
  .field-error { flex-basis: 100%; font-size: 0.8125rem; color: var(--accent); }
  .tool-actions { display: flex; gap: 8px; }

  .btn-quiet {
    font: inherit;
    font-size: 0.875rem;
    font-weight: 600;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    padding: 5px 12px;
    cursor: pointer;
  }
  .btn-quiet:hover { background: var(--hover); }
  .btn-quiet:disabled { color: var(--ink-muted); cursor: default; background: var(--surface); }
  .btn-quiet:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .grid-box { padding: 0; }
  .grid-foot {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 16px;
    padding: 8px 12px 10px;
    border-top: 1px solid var(--rule-soft);
    font-size: 0.8125rem;
    color: var(--ink-soft);
  }
  .grid-foot .notice { color: var(--ink); }
  .grid-foot .error { color: var(--accent); }

  .menu {
    position: fixed;
    z-index: 50;
    display: flex;
    flex-direction: column;
    min-width: 220px;
    padding: 4px;
    background: var(--surface);
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.14);
  }
  .menu button {
    font: inherit;
    font-size: 0.875rem;
    text-align: left;
    color: var(--ink);
    background: none;
    border: 0;
    border-radius: 3px;
    padding: 7px 10px;
    cursor: pointer;
  }
  .menu button:hover, .menu button:focus-visible { background: var(--hover); outline: none; }
  .menu button[aria-checked="true"] { font-weight: 700; }
  .menu button[aria-checked="true"]::before { content: "\2713  "; }
  .menu .danger { color: var(--accent); border-top: 1px solid var(--rule-soft); margin-top: 3px; }

  .chip.pending { background: var(--on-wash); }
  .chip.wrong { background: var(--accent-wash); color: var(--accent); }

  pre.req {
    margin: 0;
    max-height: 260px;
    overflow: auto;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    line-height: 1.5;
    color: var(--ink);
    background: var(--code-bg);
    border-radius: 3px;
    padding: 10px 12px;
  }

  ul.try { margin: 0; padding-left: 18px; font-size: 0.875rem; line-height: 1.5; color: var(--ink-soft); }
  ul.try li { margin-bottom: 6px; }
  ul.try b { color: var(--ink); }
  .try-panel { padding: 14px 16px 12px; margin-top: 14px; }

  .left { display: flex; flex-direction: column; min-width: 0; }

  kbd {
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.75rem;
    background: var(--sunk);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 0 4px;
  }

  footer.foot { margin-top: 30px; font-size: 0.8125rem; color: var(--ink-muted); }

  @media (max-width: 900px) {
    .main { grid-template-columns: minmax(0, 1fr); }
  }
  @media (max-width: 620px) {
    .pair { grid-template-columns: minmax(0, 1fr); }
    .app { padding-block: 28px 48px; padding-inline: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>

<script>
(function () {
  "use strict";

  var h = React.createElement;
  var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo,
      useRef = React.useRef, useCallback = React.useCallback, useReducer = React.useReducer;
  var G = window.GlideDataGrid;
  var DataEditor = G.DataEditor, GridCellKind = G.GridCellKind, CompactSelection = G.CompactSelection;

  var ARTICLE_URL = "index.html";
  var fmt = new Intl.NumberFormat("en-US");

  /* ------------------------------------------------------------------
     Pattern functions. The same logic as the article and the code
     repository (src/hooks/grid-editor), without the types.
  ------------------------------------------------------------------ */

  function addChangesToMap(current, changes, savedColumns) {
    var next = new Map(current);
    var copied = new Set();
    var savedById = new Map(savedColumns.map(function (c) { return [c.id, c.values]; }));

    changes.forEach(function (ch) {
      if (!copied.has(ch.columnId)) {
        next.set(ch.columnId, new Map(next.get(ch.columnId)));
        copied.add(ch.columnId);
      }
      var columnChanges = next.get(ch.columnId);
      var saved = savedById.get(ch.columnId);
      var savedValue = (saved && saved[ch.rowId]) || "";
      if (ch.value === savedValue) columnChanges.delete(ch.rowId);
      else columnChanges.set(ch.rowId, ch.value);
    });

    copied.forEach(function (id) {
      if (next.get(id) && next.get(id).size === 0) next.delete(id);
    });
    return next;
  }

  function hasValue(v) { return v !== undefined && v !== ""; }

  function getVisibleRowIds(rowIds, columns, filters) {
    var active = columns.filter(function (c) { return (filters[c.id] || "all") !== "all"; });
    if (active.length === 0) return rowIds;
    return rowIds.filter(function (rowId) {
      return active.every(function (c) {
        return filters[c.id] === "hasValue" ? hasValue(c.values[rowId]) : !hasValue(c.values[rowId]);
      });
    });
  }

  function normalize(text) { return text.trim().toLowerCase(); }

  function isHeaderRow(row, gridTitles, startColumn) {
    var matched = 0;
    for (var offset = 0; offset < row.length; offset++) {
      var cell = normalize(row[offset] || "");
      if (cell === "") continue;
      var title = gridTitles[startColumn + offset];
      if (title === undefined || normalize(title) !== cell) return false;
      matched += 1;
    }
    return matched > 0;
  }

  function getPasteChanges(p) {
    var targetCol = p.target[0], targetRow = p.target[1];
    var gridTitles = [p.idColumnTitle].concat(p.columns.map(function (c) { return c.title; }));
    var isHeaderRowSkipped = targetRow === 0 && p.values.length > 1 && isHeaderRow(p.values[0], gridTitles, targetCol);
    var firstDataRow = isHeaderRowSkipped ? 1 : 0;
    var changes = [];

    for (var pasteRow = firstDataRow; pasteRow < p.values.length; pasteRow++) {
      var rowId = p.visibleRowIds[targetRow + pasteRow - firstDataRow];
      if (rowId === undefined) break;
      p.values[pasteRow].forEach(function (value, offset) {
        var gridCol = targetCol + offset;
        if (gridCol === 0) return;
        var column = p.columns[gridCol - 1];
        if (!column) return;
        changes.push({ columnId: column.id, rowId: rowId, value: value });
      });
    }
    return { changes: changes, isHeaderRowSkipped: isHeaderRowSkipped };
  }

  function validateColumnTitle(title, columns) {
    var trimmed = title.trim();
    if (trimmed === "") return { isValid: false, error: "Column name is required" };
    if (columns.some(function (c) { return c.title === trimmed; })) {
      return { isValid: false, error: 'Column "' + trimmed + '" already exists' };
    }
    return { isValid: true };
  }

  function buildSaveRequest(columns, changes) {
    var newColumns = columns.filter(function (c) { return c.isNew; }).map(function (c) { return { id: c.id, title: c.title }; });
    var updates = [];
    changes.forEach(function (rows, columnId) {
      rows.forEach(function (value, rowId) { updates.push({ columnId: columnId, rowId: rowId, value: value }); });
    });
    return { newColumns: newColumns, updates: updates };
  }

  function countChanges(changes) {
    var n = 0;
    changes.forEach(function (rows) { n += rows.size; });
    return n;
  }

  function estimatePayloadBytes(payload) { return new TextEncoder().encode(JSON.stringify(payload)).length; }
  var MAX_PAYLOAD_BYTES = 50 * 1024 * 1024;

  function createGridEditorState(data) {
    return Object.assign({}, data, { savedColumns: data.columns, changes: new Map(), filters: {} });
  }

  function gridEditorReducer(state, action) {

        wrong: misplaced.map(function (p) { return { p: p, landed: visibleRowIds[p.row] }; }) });
    }

    function changeMode(next) {
      stopWalk();
      // Switching resets edits so each mode starts clean.
      dispatch({ type: "load", data: cloneData(server.current) });
      setPosChanges([]);
      setMode(next);
      setLastSave(null);
      setNotice(null);
    }

    function changeDataset(id) {
      stopWalk();
      resetTo(id, mode);
    }

    function runStep(i) {
      if (i === 1) {
        onCellsEdited([{ location: [1, 2], value: { kind: GridCellKind.Text, data: "35", displayData: "35", allowOverlay: true } }]);
        advance(2);
      } else if (i === 2) {
        setFilter("status", "hasValue");
        advance(3);
      } else if (i === 3) {
        save(true);
        advance(4);
      } else {
        startWalk(walk.run === "id" ? "position" : "id");
      }
    }

    /* ---------- keyboard ---------- */

    var hasSelection = selection.current !== undefined || selection.rows.length > 0 || selection.columns.length > 0;
    var keyboard = useGridKeyboard({
      isEnabled: menu === null,
      hasSelection: hasSelection,
      onClearSelection: function () { setSelection(EMPTY_SELECTION); },
      onEscapeWhenIdle: function () { setNotice("Escape with nothing open. In a modal, this is where the editor would ask to close."); }
    });

    var closeMenu = useCallback(function () { setMenu(null); }, []);

    /* ---------- grid columns ---------- */

    var gridColumns = useMemo(function () {
      return [{ id: "__row-id", title: state.idColumnTitle, width: 110 }].concat(state.columns.map(function (c) {
        var filter = state.filters[c.id] || "all";
        var suffix = c.isNew ? " (new)" : filter === "hasValue" ? " (with value)" : filter === "noValue" ? " (without value)" : "";
        var bg = c.isNew ? colors.newHeaderBg : filter !== "all" ? colors.filteredHeaderBg : undefined;
        return { id: c.id, title: c.title + suffix, width: datasetId === "large" ? 120 : 160, hasMenu: true,
          themeOverride: bg ? { bgHeader: bg, bgHeaderHovered: bg } : undefined };
      }));
    }, [state.columns, state.filters, state.idColumnTitle, colors, datasetId]);

    /* ---------- status ---------- */

    var WALK_NOTE = walk.active && walk.run === "position"
      ? "Storing Glide's [column, row] location is the tempting shortcut. Step 5 replays the same steps with row IDs."
      : "Switch “How edits are stored” to By row ID to compare.";

    var status;
    if (lastSave && lastSave.wrong.length) {
      var w0 = lastSave.wrong[0];
      status = { cls: "bad", label: "The save wrote to the wrong row",
        text: "The edit to " + w0.p.editedRowId + " was stored as row " + w0.p.row + ". When the request was built, row " + w0.p.row + " was " + w0.landed + ", so the server received " + w0.p.value + " for " + w0.landed + "." +
          (lastSave.wrong.length > 1 ? " " + (lastSave.wrong.length - 1) + " more edits landed on other rows too." : ""),
        note: WALK_NOTE };
    } else if (misplaced.length) {
      var m0 = misplaced[0];
      var landed = visibleRowIds[m0.row];
      status = { cls: "bad",
        label: misplaced.length === 1 ? "1 pending change points at the wrong row" : misplaced.length + " pending changes point at the wrong row",
        text: "The edit to " + m0.editedRowId + " is stored as row " + m0.row + ". The rows on screen changed, and row " + m0.row + " is now " + (landed || "past the last row") + ". Saving now would write " + m0.value + " to " + (landed || "no row") + ".",
        note: WALK_NOTE };
    } else if (lastSave) {
      status = { cls: "ok", label: "Saved in one request",
        text: "The server received " + fmt.format(lastSave.count) + (lastSave.count === 1 ? " cell" : " cells") +
          (lastSave.newColumns ? " and " + lastSave.newColumns + (lastSave.newColumns === 1 ? " new column" : " new columns") : "") + ", each on the row it was typed into." };
    } else if (changeCount > 0 && byId) {
      status = { cls: "ok", label: fmt.format(changeCount) + (changeCount === 1 ? " pending change" : " pending changes") + ", all on the right rows",
        text: "Each change is stored under its row ID. Filters, pastes and new columns cannot move it." };
    } else if (changeCount > 0) {
      status = { cls: "neutral", label: fmt.format(changeCount) + (changeCount === 1 ? " pending change" : " pending changes"),
        text: "Stored by row position. They point at the right rows only while the rows on screen stay where they were." };
    } else {
      status = { cls: "neutral", label: "No pending changes",
        text: "Edit a cell, paste, or add a column. Changed cells are highlighted until you save." };
    }

    /* ---------- walkthrough panel ---------- */

    var walkPanel;
    if (walk.active) {
      var items = [0, 1, 2, 3, 4].map(function (i) {
        var c = stepCopy(i, walk.run);
        var st = i < walk.done ? "done" : i === walk.done ? "current" : "upcoming";
        var body = null;
        if (st === "done" && c.done) body = h("div", { className: "step-body" }, c.done);
        if (st === "current") body = h("div", { className: "step-body" },
          c.prompt ? h("p", null, c.prompt) : null,
          c.action ? h("button", { type: "button", className: "btn", id: "walk-step-" + i, onClick: function () { runStep(i); } }, c.action) : null);
        return h("li", { key: i, className: st },
          h("span", { className: "num" }, String(i + 1)),
          h("span", { className: "step-title" }, c.title),
          body);
      });
      walkPanel = h("div", { className: "panel walk" },
        h("div", { className: "walk-head" },
          h("span", { className: "walk-title" }, "Walkthrough"),
          h("span", { className: "walk-run" }, walk.run === "id" ? "by row ID" : "by row position")),
        h("ol", { className: "steps" }, items));
    } else {
      walkPanel = h("div", { className: "panel walk" },
        h("div", { className: "walk-head" }, h("span", { className: "walk-title" }, "Walkthrough")),
        h("div", { className: "walk-off" },
          h("p", null, "You changed something by hand, so the walkthrough stopped. The status box explains what the grid is showing."),
          h("button", { type: "button", className: "btn", id: "walk-restart", onClick: function () { startWalk("position"); } }, "Restart walkthrough")));
    }

    var tryPanel = h("div", { className: "panel try-panel" },
      h("div", { className: "walk-head" }, h("span", { className: "walk-title" }, "Also try")),
      h("ul", { className: "try" },
        h("li", null, h("b", null, "Paste a column with its header."), " Click a column header, then ", h("b", null, "Paste sample column"), ". The first row, “Region”, is skipped when it lands on the Region column."),
        h("li", null, h("b", null, "Undo by hand."), " Type a cell’s old value back in. With row IDs, the pending change disappears."),
        h("li", null, h("b", null, "Add a column"), ", type in it, then remove it from its header menu. Its edits go with it."),
        h("li", null, h("kbd", null, "Ctrl"), " + ", h("kbd", null, "F"), " opens the grid’s search. ", h("kbd", null, "Esc"), " closes one thing at a time: search, cell editor, selection.")));

    /* ---------- pending list ---------- */

    var SHOW = 30;
    var pendingChips;
    var titleOf = function (id) { var c = state.columns.find(function (x) { return x.id === id; }); return c ? c.title : id; };
    if (byId) {
      var list = buildSaveRequest(state.columns, state.changes).updates;
      pendingChips = list.slice(0, SHOW).map(function (u, i) {
        return h("span", { key: i, className: "chip pending" }, titleOf(u.columnId) + " · " + u.rowId + " = " + (u.value === "" ? "(empty)" : u.value));
      });
      if (list.length > SHOW) pendingChips.push(h("span", { key: "more", className: "chip more" }, "+" + fmt.format(list.length - SHOW) + " more"));
    } else {
      pendingChips = posChanges.slice(0, SHOW).map(function (p, i) {
        var now = visibleRowIds[p.row];
        var wrong = now !== p.editedRowId;
        return h("span", { key: i, className: "chip " + (wrong ? "wrong" : "pending") },
          titleOf(p.columnId) + " · row " + p.row + " = " + p.value + " → " + (now || "no row") + (wrong ? " (typed into " + p.editedRowId + ")" : ""));
      });
      if (posChanges.length > SHOW) pendingChips.push(h("span", { key: "more", className: "chip more" }, "+" + fmt.format(posChanges.length - SHOW) + " more"));
    }

    var requestPreview = { newColumns: saveRequest.newColumns, updates: saveRequest.updates.slice(0, 12) };
    var isLarge = datasetId === "large";
    var gridHeight = isLarge ? 440 : 36 + 34 * Math.max(visibleRowIds.length, 3) + 2;

    return h(React.Fragment, null,

      h("header", { className: "top" },
        h("h1", null, "Glide Data Grid Bulk Editor"),
        h("p", { className: "sub" },
          "Companion demo for ",
          h("a", { href: ARTICLE_URL, target: "_blank", rel: "noopener" }, "How to Build an Editable Spreadsheet with Glide Data Grid"),
          ". Runs Glide Data Grid 6.0.3."),
        h("p", { className: "intro" },
          "Glide reports every edit as a [column, row] location on screen. Store that location and the edit follows the position, not the data: filter the grid and it points at a different row. Follow the walkthrough to watch it happen, then replay it with edits stored by row ID.")),

      h("div", { className: "controls" },
        h("div", { className: "control" },
          h("span", { className: "control-label" }, "How edits are stored"),
          h(Segmented, { label: "How edits are stored", value: mode, onChange: changeMode, idPrefix: "mode-", options: [
            { label: "By row position", value: "position" },
            { label: "By row ID", value: "id" }
          ] }),
          h("span", { className: "caption" }, byId
            ? "Each edit is stored under the row’s ID. Glide’s row index is only used to look the ID up."
            : h(React.Fragment, null, "Each edit is stored at the ", h("code", null, "[column, row]"), " location Glide reported. Switching resets unsaved edits."))),
        h("div", { className: "control" },
          h("span", { className: "control-label" }, "Dataset"),
          h(Segmented, { label: "Dataset", value: datasetId, onChange: changeDataset, idPrefix: "ds-", options: [
            { label: "8 sites", value: "sample" },
            { label: "1,000 sites", value: "large" }
          ] }),
          h("span", { className: "caption" }, isLarge ? "1,000 rows by 25 columns: 25,000 cells." : "Three columns, small enough to follow.")),
        h("div", { className: "control" },
          h("span", { className: "control-label" }, "Clipboard"),
          h("button", { type: "button", className: "btn-quiet", id: "paste-sample", onClick: pasteSample }, "Paste sample column"),
          h("span", { className: "caption" }, "Pastes a column copied from a spreadsheet (Region, Coast, Valley, Ridge, Plain) at the selected cell or column. Pasting from your own spreadsheet works too."))
      ),

      h("div", { className: "main" },

        h("div", { className: "left" }, walkPanel, tryPanel),

        h("div", { className: "right" },

          h("div", { className: "status " + status.cls, role: "status", "aria-live": "polite", id: "status" },
            h("div", { className: "s-label" }, status.label),
            h("div", { className: "s-text" }, status.text),
            status.note ? h("div", { className: "s-note" }, status.note) : null),

          h("div", { className: "panel" },
            h("div", { className: "toolbar" },
              h("form", { className: "add-col", onSubmit: addColumn },
                h("label", { htmlFor: "new-col" }, "New column"),
                h("input", { id: "new-col", className: "field", value: newTitle, placeholder: "Column name",
                  "aria-invalid": newError !== null, "aria-describedby": newError ? "new-col-error" : undefined,
                  onChange: function (e) { setNewTitle(e.target.value); setNewError(null); } }),
                h("button", { type: "submit", className: "btn-quiet" }, "Add column"),
                newError ? h("span", { className: "field-error", id: "new-col-error", role: "alert" }, newError) : null),
              h("div", { className: "tool-actions" },
                h("button", { type: "button", className: "btn-quiet", onClick: keyboard.openSearch }, "Search"),
                h("button", { type: "button", className: "btn-quiet", id: "save", disabled: !hasChanges, onClick: function () { save(false); } }, "Save"))),
            h("div", { className: "grid-box" },
              h(DataEditor, {
                ref: gridRef,
                key: datasetId,
                columns: gridColumns,
                rows: visibleRowIds.length,
                getCellContent: getCellContent,
                onCellsEdited: onEditedByHand,
                onPaste: onPasteByHand,
                getCellsForSelection: true,
                gridSelection: selection,
                onGridSelectionChange: setSelection,
                showSearch: keyboard.isSearchOpen,
                onSearchClose: keyboard.closeSearch,
                onHeaderMenuClick: function (col, bounds) {
                  var column = state.columns[col - 1];
                  if (column) setMenu({ column: column, x: bounds.x, y: bounds.y + bounds.height });
                },
                // No row numbers: they count from 1, and the walkthrough uses Glide's row index, which counts from 0.
                rowMarkers: "none",
                freezeColumns: 1,
                theme: colors.theme,
                width: "100%",
                height: gridHeight,
                smoothScrollX: true,
                smoothScrollY: true
              })),
            h("div", { className: "grid-foot", "aria-live": "polite" },
              h("span", { id: "change-count" }, changeCount === 1 ? "1 changed cell" : fmt.format(changeCount) + " changed cells"),
              error ? h("span", { className: "error" }, error) : null,
              !error && notice ? h("span", { className: "notice", id: "notice" }, notice) : null)),

          h("div", { className: "pair" },
            h("div", { className: "panel" },
              h("div", { className: "panel-head" },
                h("span", { className: "panel-title" }, "Pending changes"),
                h("span", { className: "count" }, byId ? "stored by row ID" : "stored by row position")),
              h("div", { className: "panel-body", id: "pending" },
                pendingChips.length ? h("div", { className: "chips" }, pendingChips) : h("div", { className: "empty" }, "Nothing"),
                h("p", { className: "hint" }, byId
                  ? "Column · row ID = new value."
                  : "Column · row = new value → the site that row points at now."))),
            h("div", { className: "panel" },
              h("div", { className: "panel-head" },
                h("span", { className: "panel-title" }, "Next save request"),
                h("span", { className: "count" }, fmt.format(saveRequest.updates.length) + (saveRequest.updates.length === 1 ? " update" : " updates"))),
              h("div", { className: "panel-body" },
                h("pre", { className: "req", id: "request" }, JSON.stringify(requestPreview, null, 2)),
                saveRequest.updates.length > 12 ? h("p", { className: "hint" }, "Showing the first 12 updates.") : null)))
        )
      ),

      menu ? h(ColumnMenu, {
        column: menu.column, x: menu.x, y: menu.y, filter: state.filters[menu.column.id], onClose: closeMenu,
        onFilter: function (f) { stopWalk(); setFilter(menu.column.id, f); setMenu(null); },
        onRemove: function () {
          stopWalk();
          var id = menu.column.id;
          dispatch({ type: "removeColumn", columnId: id });
          setPosChanges(function (prev) { return prev.filter(function (p) { return p.columnId !== id; }); });
          setMenu(null);
        }
      }) : null,

      h("footer", { className: "foot" }, h("a", { href: "../index.html" }, "Bobby Filippopoulos"), ". Sample data is fictional.")
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>

</body>
